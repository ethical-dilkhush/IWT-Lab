name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  validate-xml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Lab4/package-lock.json
      - run: npm install
      - run: node validate.js
