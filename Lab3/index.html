<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>from clone</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>Google Forms</h1>
    </header>

    <main>
      <div class="main-heading">
        <div class="sub-main-heasing"></div>
        <h3>Semester Registration Form</h3>
        <p>Fill correct data any mistake can't be changed</p>
      </div>

      <form action="#" method="get" novalidate>
        <div class="section-1">
          <div class="form-group">
            <label for="name">Full Name:</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              maxlength="100"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter a strong password"
              minlength="8"
              required
            />
          </div>
        </div>
        <div class="section-2">
          <div class="form-group">
            <label for="date">Date of Visit:</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="form-group">
            <label for="time">Time of Visit:</label>
            <input type="time" id="time" name="time" required />
          </div>

          <div class="form-group">
            <label for="service">Service Used:</label>
            
            <select id="service" name="service" required>
              <option value="">--Select--</option>
              <option value="consulting">Consulting</option>
              <option value="support">Support</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
        <div class="section-3">
          <div class="form-group">
            <label>Hobbies:</label>
            <input
              type="checkbox"
              id="hobby-reading"
              name="hobbies"
              value="reading"
            />
            <label for="hobby-reading">Reading</label><br />
            <input
              type="checkbox"
              id="hobby-sports"
              name="hobbies"
              value="sports"
            />
            <label for="hobby-sports">Sports</label><br />
            <input
              type="checkbox"
              id="hobby-coding"
              name="hobbies"
              value="coding"
            />
            <label for="hobby-coding">Coding</label>
          </div>

          <div class="form-group">
            <label>Would you recommend us?</label><br />
            <input
              type="radio"
              id="recommend-yes"
              name="recommend"
              value="yes"
              required
            />
            <label for="recommend-yes">Yes</label><br />
            <input type="radio" id="recommend-no" name="recommend" value="no" />
            <label for="recommend-no">No</label>
          </div>

          <div class="form-group">
            <label for="upload">Upload Supporting Document:</label>
            <input type="file" id="upload" name="upload" multiple />
          </div>
        </div>
        <div class="section-4">
          <div class="form-group">
            <label for="feedback">Feedback:</label>
            <textarea
              id="feedback"
              name="feedback"
              rows="5"
              placeholder="Enter your feedback here..."
              maxlength="500"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="rating">Rate Our Services:</label>
            <input
              type="range"
              id="rating"
              name="rating"
              min="1"
              max="10"
              step="1"
            />
          </div>

          <div class="form-group">
            <label for="color">Pick Your Favorite Color:</label>
            <input
              type="color"
              id="color"
              name="color"
              value="#6200ea"
              style="width: 40px"
            />
          </div>
        </div>
        <input type="hidden" name="form_id" value="google-forms-clone" />

        <button type="submit">Submit</button>
      </form>

      <script>
        function customSubmitHandler() {
          alert("Form submitted!");
          return false;
        }
      </script>
    </main>
  </body>
</html>
