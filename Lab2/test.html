<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Navigation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    /* Sidebar Styling */
    .sidebar {
      height: 100vh;
      width: 250px;
      position: fixed;
      top: 0;
      left: -250px; /* Hidden by default */
      background-color: #222;
      padding-top: 60px;
      transition: 0.3s;
      z-index: 1000;
    }

    .sidebar.active {
      left: 0; /* Show sidebar */
    }

    .sidebar a {
      padding: 15px 30px;
      text-decoration: none;
      font-size: 18px;
      color: #bbb;
      display: block;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background-color: #575757;
      color: #fff;
    }

    /* Menu Button */
    .menu-btn {
      font-size: 30px;
      cursor: pointer;
      position: fixed;
      top: 20px;
      left: 20px;
      color: #222;
      z-index: 1100;
    }

    /* Overlay Effect */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.5);
      transition: 0.3s;
      z-index: 900;
    }

    .overlay.active {
      width: 100%;
    }

    /* Responsive Sidebar */
    @media (max-width: 768px) {
      .sidebar {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <!-- Menu Button -->
  <div class="menu-btn" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Portfolio</a>
    <a href="#">Contact</a>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- Content -->
  <div style="padding: 20px;">
    <h1>Welcome to the Website</h1>
    <p>Click the menu icon to open the sidebar navigation.</p>
  </div>

  <script>
    // Toggle Sidebar Function
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
      document.getElementById("overlay").classList.toggle("active");
    }
  </script>

</body>
</html>
