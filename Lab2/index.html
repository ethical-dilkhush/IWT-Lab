<!DOCTYPE html>
<html>
<head>
    <title> Iframe Example</title>
</head>
<body style="margin: 0;padding: 0px; background: black;">
    <!-- Header Section -->
    <iframe src="header.html" style="width: 100%; height: 100px;"></iframe>
    
    <!-- Main Layout with Navigation and Content -->
    <div style="display:flex; justify-content: space-between;">
        <!-- Left Navigation -->
        <iframe src="navigation.html" style="width: 25%; height: 500px; border: none;"></iframe>

        <!-- Main Content Area -->
        <iframe src="main.html" name="mainFrame" style="width: 75%; height: 500px; border: none;"></iframe>
    </div>

    <!-- Footer Section -->
    <iframe src="footer.html" style="width: 100%; height: 50px; border: none;"></iframe>
</body>
</html>
