<!DOCTYPE html>
<html lang="en">
<head>
    <title>Image Frame</title>
</head>
<style>
    body {
        background-color: white;
        margin: 0px;
        padding: 0px;
    }
    img {
        width: 500px;
        height: 400px;
        display: block;
        margin-left: auto;
        margin-right: auto;
        overflow: hidden;
       
    }
</style>
<body>
    <h2>Image Frame</h2>
    <img src="./lab2.png" alt="Sample Image" width="500" usemap="#maping">
    <map name="#maping">
        <area shape="rect" coords="118,166,554,418" title="Ractangle" href="lab2.png" alt="no load">
    </map>

</html>
